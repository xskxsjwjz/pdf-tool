[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-simple-tool"
version = "2.1.0"
description = "A desktop PDF organizer and visual editor with annotations, handwritten signatures, and translation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "xskxsjwjz" },
]
keywords = ["pdf", "desktop", "tkinter", "editor", "signature", "translation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "pypdf>=6.0,<7",
  "tkinterdnd2>=0.4.3,<0.5",
  "pypdfium2>=4.30,<6",
  "Pillow>=10,<13",
  "reportlab>=4.4,<6",
]

[project.gui-scripts]
pdf-simple-tool = "pdf_tool.gui:main"

[project.urls]
Homepage = "https://github.com/xskxsjwjz/pdf-tool"
Repository = "https://github.com/xskxsjwjz/pdf-tool"
Issues = "https://github.com/xskxsjwjz/pdf-tool/issues"
Changelog = "https://github.com/xskxsjwjz/pdf-tool/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pdf_tool*"]
